name: AXON checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: axon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.5.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Python test dependencies
        run: python -m pip install websockets==15.0.1
      - name: Backup and media integration test dependencies
        run: sudo apt-get update && sudo apt-get install -y restic ffmpeg libreoffice-writer libreoffice-calc libreoffice-impress fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation bubblewrap poppler-utils
      - name: Install locked packages
        run: pnpm install --frozen-lockfile
      - name: Typecheck and frontend syntax
        run: pnpm run check
      - name: Application regressions
        run: pnpm run test
      - name: Native agent contracts
        run: pnpm run test:agents
      - name: Native software discovery and transaction contracts
        run: pnpm run test:software
      - name: Installer and recovery contracts
        run: pnpm run test:installer
      - name: Build application
        run: pnpm run build
      - name: Install QA browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Isolated navigation, accessibility and responsive QA
        run: pnpm run qa:full
      - name: Preserve isolated QA diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-qa-reports
          path: |
            /tmp/axon-full-qa/**/report.json
            /tmp/axon-full-qa/**/failure.json
            /tmp/axon-full-qa/server.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Validate bootstrap
        run: bash -n install.sh
      - name: Build distributed Docker image
        run: docker build --build-arg AXON_REVISION=${{ github.sha }} -t axon-ci .
      - name: Verify Docker runtime and revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          docker run -d --name axon-ci -p 127.0.0.1:34579:3457 -e "SESSION_SECRET=$(openssl rand -hex 32)" -e AXON_BIND_HOST=0.0.0.0 axon-ci
          python3 - <<'PY'
          import json, os, time, urllib.request
          for attempt in range(45):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:34579/api/health', timeout=3) as response:
                      health = json.load(response)
                  assert health['ok'] is True and health['revision'] == os.environ['EXPECTED_REVISION']
                  break
              except Exception:
                  if attempt == 44: raise
                  time.sleep(2)
          print('Distributed image starts and serves the exact published revision.')
          PY
      - name: Runtime logs
        if: always()
        run: docker logs axon-ci 2>/dev/null | grep -ivE 'secret|token|password|credential' || true
